databases:
  - name: casa-do-sabor-db
    plan: free
    databaseName: casa_do_sabor
    user: casa_do_sabor

services:
  - type: web
    name: casa-do-sabor-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: casa-do-sabor-db
          property: connectionString
      - key: CLIENT_URL
        value: https://casa-do-sabor-web.onrender.com
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: web
    name: casa-do-sabor-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://casa-do-sabor-api-qc80.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
