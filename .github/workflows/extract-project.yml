name: Extract Casa do Sabor project

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          test -f Casa_do_Sabor_Projeto.zip
          mkdir -p /tmp/casa-do-sabor
          unzip -oq Casa_do_Sabor_Projeto.zip -d /tmp/casa-do-sabor
          test -d /tmp/casa-do-sabor/casa-do-sabor
          cp -a /tmp/casa-do-sabor/casa-do-sabor/. .
          git status --short

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore README.md client server
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Add Casa do Sabor application source"
            git push
          fi
