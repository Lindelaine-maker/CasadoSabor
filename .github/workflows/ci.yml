name: CI

on:
  push:
    branches: [main, "entrega/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install API dependencies
        working-directory: server
        run: npm install
      - name: Validate Prisma schema and generate client
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/casa_sabor
        run: |
          npx prisma validate
          npx prisma generate
      - name: Check API JavaScript syntax
        working-directory: server
        run: |
          find src prisma -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Install frontend dependencies
        working-directory: client
        run: npm install
      - name: Build frontend
        working-directory: client
        run: npm run build
