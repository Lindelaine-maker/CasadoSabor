name: CI

on:
  push:
    branches: [main, "entrega/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: casa-do-sabor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/casa_sabor
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install API dependencies
        working-directory: server
        run: npm install
      - name: Audit production API dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=critical
      - name: Validate Prisma schema and generate client
        working-directory: server
        run: |
          npx prisma validate
          npx prisma generate
      - name: Check API JavaScript syntax
        working-directory: server
        run: |
          find src prisma -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run API authentication tests
        working-directory: server
        run: npm test
      - name: Install frontend dependencies
        working-directory: client
        run: npm install
      - name: Build frontend
        working-directory: client
        run: npm run build
      - name: Commit generated lockfiles
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/package-lock.json client/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Add reproducible npm lockfiles"
            git push
          fi
