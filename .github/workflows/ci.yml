name: CI

on:
  push:
    branches: [main, "entrega/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: casa-do-sabor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: casa_sabor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d casa_sabor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/casa_sabor
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install API dependencies
        working-directory: server
        run: npm install
      - name: Validate Prisma schema and generate client
        working-directory: server
        run: |
          npx prisma validate
          npx prisma generate
          npx prisma migrate deploy
          npm run seed
      - name: Check API JavaScript syntax
        working-directory: server
        run: |
          find src prisma -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run API authentication tests
        working-directory: server
        run: npm test
      - name: Run PostgreSQL CRUD smoke test
        working-directory: server
        run: npm run test:db
      - name: Install frontend dependencies
        working-directory: client
        run: npm install
      - name: Build frontend
        working-directory: client
        run: npm run build
      - name: Commit generated lockfiles
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/package-lock.json client/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Add reproducible npm lockfiles"
            git push
          fi
      - name: Audit production API dependencies
        working-directory: server
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); const v=Object.entries(a.vulnerabilities||{}); console.log(JSON.stringify(v.map(([name,x])=>({name,severity:x.severity,via:x.via,fixAvailable:x.fixAvailable})),null,2)); if(v.some(([,x])=>['high','critical'].includes(x.severity))) process.exit(1)"
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: server/npm-audit.json
          if-no-files-found: ignore
